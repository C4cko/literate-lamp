name: t2-suzan-emergency-contacts
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - dados-testes:/var/lib/mysql
  phpunit:
    build: .
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    environment:
      COMPOSER_ALLOW_SUPERUSER: '1'
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ${OHRM_SRC:-../../../fontes/orangehrm}:/app
      - ./cli_install_config.yaml:/app/installer/cli_install_config.yaml:ro
      - ./scripts:/scripts:ro
      - ../resultados/originais:/resultados
    entrypoint: [sleep, infinity]
volumes:
  dados-testes:
