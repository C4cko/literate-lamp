# T2 VERVAL (PUCRS): massa dos testes de integração de Punch In / Punch Out (IT-01 a IT-11).
#
# Funcionários e usuários (todos ESS, exceto o 1):
#   emp 1  admin                  sem registros
#   emp 2  ESS                    sem registros (entrada nova, nota, fusos, margem de 180 s)
#   emp 3  ESS                    1 registro PUNCHED IN  (entrada 2026-11-16 04:30 UTC = 10:00 em +05:30)
#   emp 4  ESS                    1 registro PUNCHED OUT (2026-11-15 03:30 a 11:30 UTC)
#   emp 5  ESS                    sem registros (saída sem entrada aberta)
#
# Fluxo de Attendance do papel ESS, igual ao de uma instalação limpa (ohrm_workflow_state_machine):
#   INITIAL --Punch In (0)--> PUNCHED IN --Punch Out (1)--> PUNCHED OUT
# A opção "Employee can change current time" NÃO está ligada: ela é a linha ESS/INITIAL/EDIT_PUNCH_TIME (8), que os
# testes acrescentam quando precisam dela.

