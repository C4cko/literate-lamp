name: Suzan - testes originais de contatos de emergencia

on:
  pull_request:
    paths:
      - '.github/workflows/suzan-emergency-contacts.yml'
      - 'suzan-stockey/ambiente/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suzan-emergency-contacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  originais:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: orangehrm-original
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: orangehrm/orangehrm
          ref: 56e23b3b09e7af29317a0943523b825843fff527
          path: orangehrm-original
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: pdo_mysql, curl, mbstring, zip, dom, xml, simplexml, gd, ldap, intl
          tools: composer:2.8
          coverage: none
      - name: Preparar cliente do banco e configuracao
        run: |
          set -euo pipefail
          mkdir -p ../suzan-stockey/resultados/originais
          sudo apt-get update -qq
          sudo apt-get install -y mariadb-client
          sed 's/hostName: db/hostName: 127.0.0.1/' ../suzan-stockey/ambiente/cli_install_config.yaml > installer/cli_install_config.yaml
      - name: Preparar dependencias e banco de testes
        run: |
          set -euo pipefail
          {
            composer install -d src --no-interaction --no-progress
            composer install -d devTools/core --no-interaction --no-progress
            php installer/cli_install.php
            php devTools/core/console.php i:create-test-db -p root --dump-options=--ssl=0
          } 2>&1 | tee ../suzan-stockey/resultados/originais/preparacao-ci.txt
      - name: Executar testes originais
        run: |
          set -euo pipefail
          results=../suzan-stockey/resultados/originais
          {
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            git rev-parse HEAD
            php --version
            composer --version
            ./src/vendor/bin/phpunit --version
            php -r '$p=new PDO("mysql:host=127.0.0.1;dbname=suzan_emergency_dev", "root", "root"); echo "Banco: ".$p->query("SELECT VERSION()")->fetchColumn().PHP_EOL;'
          } > "$results/ambiente.txt" 2>&1
          set +e
          ./src/vendor/bin/phpunit --colors=never --testdox \
            --filter '(EmpEmergencyContactDaoTest|EmpEmergencyContactServiceTest|EmpEmergencyContactTest)' \
            --log-junit "$results/phpunit-junit.xml" src/plugins/orangehrmPimPlugin/test \
            2>&1 | tee "$results/phpunit-testdox.txt"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$results/exit-code.txt"
          exit "$status"
      - name: Registrar resultado no resumo
        if: always()
        run: |
          {
            echo '## Testes originais de contatos de emergência — #26'
            echo 'Código OrangeHRM: 56e23b3b09e7af29317a0943523b825843fff527'
            echo '```text'
            if [ -f ../suzan-stockey/resultados/originais/phpunit-testdox.txt ]; then
              tail -n 30 ../suzan-stockey/resultados/originais/phpunit-testdox.txt
            else
              echo 'A execução não chegou ao PHPUnit; consulte os logs de preparação.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar logs e relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suzan-emergency-contacts-originais-${{ github.run_id }}
          path: suzan-stockey/resultados/originais/
          retention-days: 30
          if-no-files-found: error
